name: CI
on: [push, pull_request]

jobs:
  test:
    # The MLX-free targets are the point of this job: geometry, the frame
    # lattice, checkpoint identification and the memory planner all test
    # without a GPU and without a 66 GB download, so CI can actually run them.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      # SwiftPM does not build MLX's Metal kernels — mlx-swift compiles them in
      # its Xcode project — so the MLX-linked test targets die on their first
      # GPU operation without this step. See CONTRIBUTING.md.
      - name: Build tests
        run: swift build --build-tests
      - name: Bootstrap Metal kernels
        run: ./Scripts/bootstrap-metal.sh
      # --skip-build, because a plain `swift test` relinks the test bundle and
      # deletes the metallib the step above just placed inside it.
      - name: Test
        run: swift test --skip-build
